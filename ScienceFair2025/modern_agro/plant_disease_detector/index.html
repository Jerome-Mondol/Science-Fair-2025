<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plant Disease Detector</title>
  <style>
    #preview-container {
      margin-top: 15px;
      width: 100%;
      max-height: 250px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(46, 125, 50, 0.2);
      background: #f0f9f1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      height: 250px; /* fixed height to keep space */
    }

    #preview {
      max-width: 100%;
      max-height: 250px;
      object-fit: contain;
      display: none; /* hide initially */
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      margin: auto;
    }

    #preview-text {
      color: #a5d6a7;
      font-size: 1.2rem;
      font-weight: 600;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #e8f5e9;
      color: #2e7d32;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      flex-direction: column;
    }
    .container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.15);
      width: 350px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      font-weight: 700;
      font-size: 1.8rem;
    }
    input[type="file"] {
      margin-bottom: 20px;
      width: 100%;
      padding: 10px;
      border: 2px solid #a5d6a7;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.3s ease;
    }
    input[type="file"]:hover {
      border-color: #66bb6a;
    }
    button {
      background-color: #388e3c;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #2e7d32;
    }
    #result {
      margin-top: 25px;
      font-weight: 600;
      font-size: 1.1rem;
      min-height: 2.2rem;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>🌿 Plant Disease Detector</h1>
    <input type="file" id="imageInput" accept="image/*" />
    
    <div id="preview-container">
      <span id="preview-text">No image yet</span>
      <img id="preview" src="" alt="Image preview will appear here" />
    </div>
    
    <button onclick="detectDisease()">Detect Disease</button>
    <p id="result"></p>
    <h1 class="footer-name">Made by Jerome Mondol.</h1>
  </div>

  <footer>
  </footer>

  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const previewText = document.getElementById('preview-text');

    // Show preview when image changes
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        previewText.style.display = 'none';
      } else {
        preview.src = '';
        preview.style.display = 'none';
        previewText.style.display = 'block';
      }
    });

    // Base64 helper
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          const base64String = reader.result.split(',')[1];
          resolve(base64String);
        };
        reader.onerror = error => reject(error);
      });
    }

    async function detectDisease() {
      const input = document.getElementById('imageInput');
      const resultEl = document.getElementById('result');

      if (!input.files.length) {
        alert('Upload an image!');
        return;
      }

      resultEl.textContent = 'Detecting...';

      try {
        const base64Image = await toBase64(input.files[0]);

        const response = await fetch('https://api-inference.huggingface.co/models/linkanjarad/mobilenet_v2_1.0_224-plant-disease-identification', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer 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',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ inputs: base64Image })
        });

        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();

        if (Array.isArray(data) && data[0]?.label) {
          resultEl.textContent = `Disease detected: ${data[0].label} (confidence: ${(data[0].score * 100).toFixed(2)}%)`;
        } else if (data.error) {
          resultEl.textContent = `API error: ${data.error}`;
        } else {
          resultEl.textContent = 'Unexpected response. Check console.';
          console.log(data);
        }
      } catch (err) {
        console.error(err);
        resultEl.textContent = 'Error detecting disease. See console for details.';
      }
    }
  </script>
</body>
</html>
